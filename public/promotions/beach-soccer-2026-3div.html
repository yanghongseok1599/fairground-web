<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1350, initial-scale=1">
  <title>FairGround Beach Soccer 2026</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: "Apple SD Gothic Neo", -apple-system, sans-serif;
      word-break: keep-all;
    }

    .poster {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(circle at 82% 16%, rgba(243, 211, 138, 0.94) 0 76px, rgba(243, 211, 138, 0.28) 77px 138px, transparent 139px),
        radial-gradient(circle at 10% 8%, rgba(255, 255, 255, 0.62) 0 3px, transparent 4px),
        linear-gradient(180deg, #55c9ff 0%, #1e8fff 24%, #0047ab 58%, #06162a 76%, #f5dfa7 76%, #f8e8bc 100%);
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(112deg, transparent 0 20%, rgba(255, 255, 255, 0.18) 20.2% 20.7%, transparent 21% 100%),
        linear-gradient(118deg, transparent 0 35%, rgba(255, 255, 255, 0.12) 35.1% 35.55%, transparent 35.8% 100%),
        radial-gradient(circle at 16% 44%, rgba(255, 255, 255, 0.18) 0 2px, transparent 3px),
        radial-gradient(circle at 23% 50%, rgba(255, 255, 255, 0.14) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 46%, rgba(255, 255, 255, 0.13) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 54%, rgba(255, 255, 255, 0.16) 0 2px, transparent 3px);
      pointer-events: none;
    }

    .poster::after {
      content: "";
      position: absolute;
      left: -40px;
      right: -40px;
      bottom: -66px;
      height: 442px;
      background:
        radial-gradient(ellipse at 18% 26%, rgba(6, 22, 42, 0.10) 0 2px, transparent 3px),
        radial-gradient(ellipse at 26% 39%, rgba(6, 22, 42, 0.10) 0 2px, transparent 3px),
        radial-gradient(ellipse at 45% 22%, rgba(6, 22, 42, 0.08) 0 2px, transparent 3px),
        radial-gradient(ellipse at 61% 42%, rgba(6, 22, 42, 0.10) 0 2px, transparent 3px),
        radial-gradient(ellipse at 80% 29%, rgba(6, 22, 42, 0.08) 0 2px, transparent 3px),
        linear-gradient(180deg, #f8e7b9 0%, #f2d38f 100%);
      transform: rotate(-1.5deg);
      transform-origin: center top;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      left: 0;
      top: 710px;
      width: 1080px;
      height: 240px;
      pointer-events: none;
      z-index: 1;
    }

    .wave svg {
      display: block;
      width: 1080px;
      height: 240px;
    }

    .sea-lines {
      position: absolute;
      left: 0;
      top: 560px;
      width: 1080px;
      height: 240px;
      z-index: 1;
      opacity: 0.72;
      pointer-events: none;
    }

    .sea-lines span {
      position: absolute;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
    }

    .sea-lines span:nth-child(1) {
      left: 76px;
      top: 28px;
      width: 168px;
    }

    .sea-lines span:nth-child(2) {
      right: 86px;
      top: 68px;
      width: 230px;
    }

    .sea-lines span:nth-child(3) {
      left: 176px;
      top: 126px;
      width: 286px;
    }

    .sea-lines span:nth-child(4) {
      right: 194px;
      top: 164px;
      width: 150px;
    }

    .content {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      padding: 68px 74px 52px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.17em;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(6, 22, 42, 0.22);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 202px;
      height: 46px;
      padding: 0 22px;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      background: rgba(6, 22, 42, 0.23);
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.12em;
      box-shadow: 0 16px 32px rgba(6, 22, 42, 0.18);
    }

    .hero {
      position: absolute;
      left: 74px;
      top: 174px;
      width: 932px;
    }

    .kicker {
      margin: 0 0 2px;
      color: #f3d38a;
      font-size: 72px;
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-shadow: 0 6px 22px rgba(6, 22, 42, 0.28);
    }

    .title {
      margin: 0;
      color: #ffffff;
      font-size: 94px;
      font-weight: 900;
      line-height: 1.04;
      letter-spacing: 0;
      text-shadow: 0 10px 30px rgba(6, 22, 42, 0.32);
    }

    .divisions {
      display: flex;
      gap: 16px;
      margin-top: 34px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 156px;
      height: 66px;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.82);
      color: #ffffff;
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 14px 28px rgba(6, 22, 42, 0.18);
    }

    .pill.gold {
      border-color: #f3d38a;
      background: #f3d38a;
      color: #06162a;
      box-shadow: 0 16px 34px rgba(6, 22, 42, 0.25), inset 0 -5px 0 rgba(6, 22, 42, 0.08);
    }

    .info-card {
      position: absolute;
      left: 74px;
      top: 594px;
      width: 598px;
      padding: 28px 30px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      background: rgba(6, 22, 42, 0.72);
      box-shadow: 0 28px 62px rgba(6, 22, 42, 0.32);
      backdrop-filter: blur(1px);
    }

    .info-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      align-items: center;
      min-height: 63px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .label {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #f3d38a;
      font-size: 25px;
      font-weight: 900;
      line-height: 1;
    }

    .label::before {
      content: "";
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #1e8fff;
      box-shadow: 0 0 0 5px rgba(30, 143, 255, 0.22);
    }

    .value {
      color: #ffffff;
      font-size: 29px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .field-mark {
      position: absolute;
      right: 44px;
      top: 580px;
      width: 358px;
      height: 282px;
      border: 3px solid rgba(255, 255, 255, 0.55);
      border-radius: 32px;
      opacity: 0.72;
      transform: rotate(-9deg);
      z-index: 2;
      pointer-events: none;
    }

    .field-mark::before,
    .field-mark::after {
      content: "";
      position: absolute;
      border: 3px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;
    }

    .field-mark::before {
      left: 122px;
      top: 84px;
      width: 108px;
      height: 108px;
    }

    .field-mark::after {
      left: 174px;
      top: -3px;
      width: 0;
      height: 282px;
      border-width: 0 0 0 3px;
      border-radius: 0;
    }

    .ball {
      position: absolute;
      right: 116px;
      top: 826px;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 45% 44%, #ffffff 0 13px, transparent 14px),
        conic-gradient(from -18deg at 50% 50%, #06162a 0 13%, #ffffff 13% 24%, #0047ab 24% 37%, #ffffff 37% 49%, #1e8fff 49% 63%, #ffffff 63% 77%, #f3d38a 77% 88%, #ffffff 88% 100%);
      box-shadow: 0 26px 44px rgba(6, 22, 42, 0.25);
      z-index: 4;
    }

    .ball::before {
      content: "";
      position: absolute;
      inset: 11px;
      border: 5px solid rgba(6, 22, 42, 0.16);
      border-radius: 50%;
    }

    .ball::after {
      content: "";
      position: absolute;
      left: 21px;
      top: 18px;
      width: 48px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.52);
      transform: rotate(-28deg);
    }

    .highlight {
      position: absolute;
      left: 74px;
      right: 74px;
      bottom: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 106px;
      border-radius: 22px;
      background:
        linear-gradient(90deg, rgba(6, 22, 42, 0.18), transparent 18%, transparent 82%, rgba(6, 22, 42, 0.18)),
        #f3d38a;
      color: #06162a;
      font-size: 44px;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: 0;
      box-shadow: 0 24px 44px rgba(6, 22, 42, 0.18), inset 0 -7px 0 rgba(6, 22, 42, 0.10);
      z-index: 5;
    }

    .highlight::before,
    .highlight::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 13px;
      height: 64px;
      border-radius: 999px;
      background: #ef4f45;
      transform: translateY(-50%);
    }

    .highlight::before {
      left: 26px;
    }

    .highlight::after {
      right: 26px;
    }

    .footer {
      position: absolute;
      left: 74px;
      right: 74px;
      bottom: 54px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      color: #06162a;
      z-index: 5;
    }

    .domain {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .footer-brand {
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="FairGround 전국 비치사커대회 포스터">
    <div class="sea-lines" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="wave" aria-hidden="true">
      <svg viewBox="0 0 1080 240" preserveAspectRatio="none" role="img">
        <path d="M0 61 C95 96 157 91 244 57 C351 15 431 12 532 51 C637 92 718 111 820 69 C928 24 1008 28 1080 58 L1080 240 L0 240 Z" fill="#f8e7b9"/>
        <path d="M0 54 C100 90 161 84 248 52 C350 14 431 14 532 49 C637 86 721 103 821 65 C931 23 1006 27 1080 55 L1080 103 C1004 78 933 72 828 108 C723 144 640 128 530 89 C432 54 352 55 250 91 C156 124 94 119 0 85 Z" fill="rgba(255,255,255,0.65)"/>
        <path d="M0 79 C99 112 161 106 250 78 C350 46 431 46 532 78 C636 111 722 126 824 94 C928 61 1008 64 1080 87" fill="none" stroke="rgba(0,71,171,0.22)" stroke-width="5"/>
      </svg>
    </div>

    <div class="field-mark" aria-hidden="true"></div>
    <div class="ball" aria-hidden="true"></div>

    <section class="content">
      <header class="topbar">
        <div class="wordmark">FAIRGROUND</div>
        <div class="badge">SUMMER PROJECT</div>
      </header>

      <div class="hero">
        <p class="kicker">BEACH SOCCER</p>
        <h1 class="title">전국 비치사커대회</h1>
        <div class="divisions" aria-label="대회 부문">
          <span class="pill">대학부</span>
          <span class="pill gold">남자부</span>
          <span class="pill">여자부</span>
        </div>
      </div>

      <section class="info-card" aria-label="대회 정보">
        <div class="info-row">
          <div class="label">일정</div>
          <div class="value">2026.08.07 (금)</div>
        </div>
        <div class="info-row">
          <div class="label">장소</div>
          <div class="value">강원 동해시 망상해수욕장</div>
        </div>
        <div class="info-row">
          <div class="label">총상금</div>
          <div class="value">200만원</div>
        </div>
        <div class="info-row">
          <div class="label">참가비</div>
          <div class="value">30만원</div>
        </div>
      </section>

      <div class="highlight">각 부문 4팀 미만 시 미진행</div>

      <footer class="footer">
        <div class="domain">fairground.kr</div>
        <div class="footer-brand">FairGround</div>
      </footer>
    </section>
  </main>
</body>
</html>
